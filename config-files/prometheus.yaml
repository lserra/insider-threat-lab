global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/alert-rules.yaml

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: "insider-threat-analyzer"
    static_configs:
      - targets: ["detection-analyzer:9464"]
